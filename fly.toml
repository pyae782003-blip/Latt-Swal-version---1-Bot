# fly.toml app configuration file generated for latt-swal-version---1-bot on 2026-10-26T17:45:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'latt-swal-version---1-bot'
primary_region = 'sin'

[build]

[env]
  DATABASE_PATH = '/data/store.db'
  PORT = '8080'
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
